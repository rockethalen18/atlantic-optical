name: Deploy to Banahosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build
        run: npm run build

      - name: List build output
        run: ls -la out/

      - name: Test FTP login
        run: |
          apt-get update && apt-get install -y ftp lftp
          echo "USER $FTP_USER" | timeout 10 curl -s "ftp://$FTP_HOST:21" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T /dev/null 2>&1 || true
          lftp -e "set ssl:verify-certificate no; ls; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" 2>&1 || true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy via lftp
        run: |
          lftp -e "set ssl:verify-certificate no; mirror -R --delete --verbose ./out/ /; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
