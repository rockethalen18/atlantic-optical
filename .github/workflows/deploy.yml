name: Deploy to Banahosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build
        run: |
          # next/font/google fetches the font files from Google at build time.
          # That fetch occasionally fails on CI, so retry a couple of times.
          for attempt in 1 2 3; do
            if npm run build; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Build failed on attempt $attempt - retrying in 20s"
            rm -rf .next
            sleep 20
          done
          echo "Build failed after 3 attempts"
          exit 1
        env:
          NEXT_PUBLIC_API_URL: https://equipos.atlanticopticalgroup.com/backend/api

      # The build is packaged as one ZIP and uploaded over HTTPS. The shared
      # host rejects FTP logins coming from the GitHub runner pool with
      # "530 Login authentication failed", so FTP is only kept as a fallback.
      #
      # The package mirrors the layout of the site:
      #   site/...           the static export (the site root)
      #   site/admin/...     the admin panel
      #   site/backend/...   the API
      #   site/catalogos/... the product catalog
      - name: Package the build
        run: |
          rm -rf .deploy
          mkdir -p .deploy/site/admin .deploy/site/backend .deploy/site/catalogos
          cp -r out/. .deploy/site/
          cp -r admin/. .deploy/site/admin/
          cp -r backend/. .deploy/site/backend/
          cp catalogos/products.json .deploy/site/catalogos/products.json
          cd .deploy
          zip -qr ../deploy-package.zip site
          cd ..
          ls -lh deploy-package.zip

      - name: Deploy over HTTPS
        run: |
          curl --fail --silent --show-error --max-time 900 \
               -X POST \
               -H "X-Deploy-Key: ${DEPLOY_KEY}" \
               -F "package=@deploy-package.zip" \
               "https://equipos.atlanticopticalgroup.com/admin/deploy-package"
          echo
          echo "Deployed over HTTPS."
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      # Fallback for the rare case where the HTTPS upload is not possible.
      # Everything is uploaded through ONE FTP session: the host only accepts a
      # limited number of sessions at the same time, so opening a new session
      # for every folder makes the deploy fail. "mirror -R" changes lftp's
      # working directory, so each mirror is preceded by a "cd" to the root.
      - name: Fallback - deploy over FTP
        if: failure()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          source .github/ftp-helper.sh
          find ./out/ -type f -exec touch {} +

          CMD="cd '${TARGET_DIR}';"
          CMD="${CMD} mirror -R --verbose --parallel=3 '${GITHUB_WORKSPACE}/out/' '${TARGET_DIR}';"
          CMD="${CMD} cd '${TARGET_DIR}';"
          CMD="${CMD} mirror -R --verbose '${GITHUB_WORKSPACE}/backend/' '${TARGET_DIR}backend/';"
          CMD="${CMD} cd '${TARGET_DIR}';"
          CMD="${CMD} mirror -R --verbose '${GITHUB_WORKSPACE}/admin/' '${TARGET_DIR}admin/';"
          CMD="${CMD} cd '${TARGET_DIR}';"
          CMD="${CMD} mirror -R --verbose --include=products.json '${GITHUB_WORKSPACE}/catalogos/' '${TARGET_DIR}catalogos/';"

          ftp_run "$CMD"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/equipos.atlanticopticalgroup.com/' }}
          # Keep the fallback short: the HTTPS deploy is the normal path.
          FTP_ATTEMPTS: 6
          FTP_RETRY_DELAY: 30

      - name: Sync product list to database
        run: |
          sleep 5
          # Makes sure the admin panel lists exactly the products the public
          # catalog has (creates missing rows, hides broken leftover rows).
          curl -skG --fail --silent --show-error --max-time 180 \
               --data-urlencode "key=${IMAGE_SYNC_SECRET}" \
               "https://equipos.atlanticopticalgroup.com/admin/sync-products" \
            || echo "Sync products failed (non-critical)"
        env:
          IMAGE_SYNC_SECRET: ${{ secrets.IMAGE_SYNC_SECRET }}

      - name: Sync product images to database
        run: |
          sleep 10
          # The server redirects /admin/*.php to the extension-less URL, so follow it.
          curl -skG --fail --silent --show-error --max-time 60 \
               --data-urlencode "key=${IMAGE_SYNC_SECRET}" \
               "https://equipos.atlanticopticalgroup.com/admin/sync-images" \
            || echo "Sync images failed (non-critical)"
        env:
          IMAGE_SYNC_SECRET: ${{ secrets.IMAGE_SYNC_SECRET }}

      - name: Sync product gallery to database
        run: |
          sleep 5
          curl -skG --fail --silent --show-error --max-time 120 \
               --data-urlencode "key=${IMAGE_SYNC_SECRET}" \
               "https://equipos.atlanticopticalgroup.com/admin/sync-gallery" \
            || echo "Sync gallery failed (non-critical)"
        env:
          IMAGE_SYNC_SECRET: ${{ secrets.IMAGE_SYNC_SECRET }}

      - name: Verify published catalog
        run: |
          curl --fail --silent --show-error --max-time 60 "https://equipos.atlanticopticalgroup.com/productos/" | grep -q '/images/extracted_images/AO-104.jpg'
          curl --fail --silent --show-error --max-time 60 "https://equipos.atlanticopticalgroup.com/catalogos/products.json" | grep -q '/images/extracted_images/AO-104.jpg'
          curl --fail --silent --show-error --max-time 60 "https://equipos.atlanticopticalgroup.com/backend/api/products?limit=1" | grep -q 'AO-104'
          echo "Frontend, catalog and API verified."
