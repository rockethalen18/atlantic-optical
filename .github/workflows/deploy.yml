name: Deploy to Banahosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build
        run: npm run build

      - name: List build output
        run: ls -la out/

      - name: Test FTP connection
        run: |
          curl -v --ftp-ssl-control --connect-timeout 10 "ftp://${{ secrets.FTP_HOST }}:21" --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}" 2>&1 | head -50

      - name: Deploy frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./out/
          server-dir: ./
          protocol: ftps
          port: 21
