name: Deploy to Banahosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://equipos.atlanticopticalgroup.com/backend/api

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy frontend
        run: |
          lftp -e "set ssl:verify-certificate no; mirror -R --verbose ./out/ /; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy backend
        run: |
          lftp -e "set ssl:verify-certificate no; mirror -R --verbose ./backend/ /backend/; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy admin
        run: |
          lftp -e "set ssl:verify-certificate no; mirror -R --verbose ./admin/ /admin/; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
