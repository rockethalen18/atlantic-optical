name: Deploy to Banahosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build
        run: |
          # next/font/google fetches the font files from Google at build time.
          # That fetch occasionally fails on CI, so retry a couple of times.
          for attempt in 1 2 3; do
            if npm run build; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Build failed on attempt $attempt - retrying in 20s"
            rm -rf .next
            sleep 20
          done
          echo "Build failed after 3 attempts"
          exit 1
        env:
          NEXT_PUBLIC_API_URL: https://equipos.atlanticopticalgroup.com/backend/api

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify FTP deployment path
        run: |
          source .github/ftp-helper.sh
          ftp_run "pwd"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy frontend
        run: |
          source .github/ftp-helper.sh
          find ./out/ -type f -exec touch {} +
          ftp_run "mirror -R --verbose --parallel=5 ./out/ \"$TARGET_DIR\""
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/equipos.atlanticopticalgroup.com/' }}

      - name: Deploy backend
        run: |
          source .github/ftp-helper.sh
          ftp_run "mirror -R --verbose ./backend/ \"${TARGET_DIR}backend/\""
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/equipos.atlanticopticalgroup.com/' }}

      - name: Deploy admin
        run: |
          source .github/ftp-helper.sh
          ftp_run "mirror -R --verbose ./admin/ \"${TARGET_DIR}admin/\""
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/equipos.atlanticopticalgroup.com/' }}

      - name: Deploy catalog (products.json)
        run: |
          source .github/ftp-helper.sh
          ftp_run "mirror -R --verbose --include=products.json ./catalogos/ \"${TARGET_DIR}catalogos/\""
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/equipos.atlanticopticalgroup.com/' }}

      - name: Sync product images to database
        run: |
          sleep 10
          # The server redirects /admin/*.php to the extension-less URL, so follow it.
          curl -skL --max-time 60 "https://equipos.atlanticopticalgroup.com/admin/sync-images?key=atlantic-sync-2026" || echo "Sync images failed (non-critical)"

      - name: Sync product gallery to database
        run: |
          sleep 5
          curl -skL --max-time 120 "https://equipos.atlanticopticalgroup.com/admin/sync-gallery?key=atlantic-sync-2026" || echo "Sync gallery failed (non-critical)"

      - name: Verify published catalog
        run: |
          curl --fail --silent --show-error --max-time 60 "https://equipos.atlanticopticalgroup.com/productos/" | grep -q '/images/extracted_images/AO-104.jpg'
          curl --fail --silent --show-error --max-time 60 "https://equipos.atlanticopticalgroup.com/catalogos/products.json" | grep -q '/images/extracted_images/AO-104.jpg'
          echo "Frontend and catalog verified."
